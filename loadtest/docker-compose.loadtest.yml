# 단일 서버 부하 측정용 구성 ( app + mysql ).
# 부하 생성기(k6)는 컨테이너가 아니라 호스트에서 실행해 측정 대상과 분리한다.
#
# 현재 환경: Apple M4 ( P코어 4 + E코어 6 = 10, 16GB ). 같은 박스에서 k6 생성기까지 돌리는 제약.
#   - app   : cpuset 0-2 (3 vCPU), mem 3g, heap 2g
#   - mysql : cpuset 3-5 (3 vCPU), mem 2.5g
#   - app:db 를 3:3 대칭으로 둬 DB 가 인위적 병목이 되지 않게 한다 ( 이전 4:2 는 DB 를 일찍 병목으로 만듦 ).
#   - 남는 vCPU 6-9 + 호스트 = k6 생성기/macOS 몫. 단 cpuset 은 VM vCPU 핀일 뿐 물리 P/E 코어는 못 가린다
#     → 절대 수치는 신뢰 불가, "같은 세션 백투백 상대 비교"에만 신뢰를 둘 것.
#   - 측정 전: 무관 컨테이너 정지(docker stop), 전원 연결, 부하는 dropped 안 뜨는 클린 존(≤~600)에서.
#   - 호스트 8080 은 다른 컨테이너가 점유 중이라 app 은 18080 으로 매핑.
#
# 실행: docker compose -f loadtest/docker-compose.loadtest.yml up --build -d

services:
  reserve-mysql:
    image: mysql:8.0
    container_name: reserve-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "0136"
      MYSQL_DATABASE: reserve_project
      TZ: Asia/Seoul
    volumes:
      - ./mysql/my.cnf:/etc/mysql/conf.d/loadtest.cnf:ro
    # 호스트 포트는 매핑하지 않는다 ( 앱은 compose 네트워크로 접속, 모니터링은 docker exec ).
    # 호스트에서 직접 mysql CLI 가 필요하면 아래를 13306 등으로 추가:  ports: ["13306:3306"]
    cpuset: "3,4,5"
    mem_limit: 2560m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p0136"]
      interval: 5s
      timeout: 3s
      retries: 30

  reserve-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: reserve-app
    depends_on:
      reserve-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      # 힙/GC 고정 → 측정 재현성. 컨테이너 3g 안에서 동작
      JAVA_TOOL_OPTIONS: "-Xms2g -Xmx2g -XX:+UseG1GC -Xlog:gc:stdout:time"
      TZ: Asia/Seoul
      # 튜닝 A/B 파라미터 ( env > profile properties, 재빌드 없이 --force-recreate 만으로 적용 )
      SERVER_TOMCAT_THREADS_MAX: "${TOMCAT_THREADS_MAX:-200}"
      SERVER_TOMCAT_ACCEPT_COUNT: "${TOMCAT_ACCEPT_COUNT:-100}"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "${HIKARI_POOL:-30}"
    ports:
      - "18080:8080"
    cpuset: "0,1,2"
    mem_limit: 3g

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body style="font-family: 'Malgun Gothic', sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">

    <!-- 예약 확인 -->
    <h2 th:if="${isReserved}" style="color: #2e7d32;">예약 확인</h2>
    <p th:if="${isReserved}"><span th:text="${memberName}">홍길동</span>님, 예약 확인 내역을 안내드립니다.</p>

    <!-- 예약 취소 -->
    <h2 th:if="${!isReserved}" style="color: #c62828;">예약 취소</h2>
    <p th:if="${!isReserved}"><span th:text="${memberName}">홍길동</span>님, 예약 취소 내역을 안내드립니다.</p>

    <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
        <tr>
            <td style="padding: 10px; border: 1px solid #ddd; background: #f5f5f5; width: 35%;">예약 번호</td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${reservationNumber}">RES-001</td>
        </tr>
        <tr>
            <td style="padding: 10px; border: 1px solid #ddd; background: #f5f5f5;">공연명</td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${performanceTitle} + ' (' + ${performanceType} + ')'">공연 (뮤지컬)</td>
        </tr>
        <tr>
            <td style="padding: 10px; border: 1px solid #ddd; background: #f5f5f5;">공연장</td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${venueName} + ' (' + ${venueLocation} + ')'">공연장 (서울)</td>
        </tr>
        <tr>
            <td style="padding: 10px; border: 1px solid #ddd; background: #f5f5f5;">공연 시간</td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${startTime} + ' ~ ' + ${endTime}">2026-04-01 19:00 ~ 21:00</td>
        </tr>
        <tr>
            <td style="padding: 10px; border: 1px solid #ddd; background: #f5f5f5;">좌석</td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${seatNumbers}">A1, A2</td>
        </tr>
        <tr>
            <td style="padding: 10px; border: 1px solid #ddd; background: #f5f5f5;">원가</td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${#numbers.formatInteger(totalAmount, 1, 'COMMA')} + '원'">100,000원</td>
        </tr>
        <tr>
            <td style="padding: 10px; border: 1px solid #ddd; background: #f5f5f5;">리워드 할인</td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="'-' + ${#numbers.formatInteger(rewardDiscountAmount, 1, 'COMMA')} + '원'">-10,000원</td>
        </tr>
        <tr>
            <td style="padding: 10px; border: 1px solid #ddd; background: #f5f5f5; font-weight: bold;">최종 결제 금액</td>
            <td style="padding: 10px; border: 1px solid #ddd; font-weight: bold;" th:text="${#numbers.formatInteger(finalAmount, 1, 'COMMA')} + '원'">90,000원</td>
        </tr>
        <tr th:if="${isReserved}">
            <td style="padding: 10px; border: 1px solid #ddd; background: #f5f5f5;">예약 일시</td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${reservedAt}">2026-03-28 15:00</td>
        </tr>
        <tr th:if="${!isReserved}">
            <td style="padding: 10px; border: 1px solid #ddd; background: #f5f5f5;">취소 일시</td>
            <td style="padding: 10px; border: 1px solid #ddd;" th:text="${cancelledAt}">2026-03-28 16:00</td>
        </tr>
    </table>

</body>
</html>

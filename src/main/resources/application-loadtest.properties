management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
# Tomcat 스레드 메트릭(tomcat.threads.busy 등)을 노출하려면 MBean 레지스트리가 필요하다
server.tomcat.mbeanregistry.enabled=true


spring.datasource.url=jdbc:mysql://reserve-mysql:3306/reserve_project?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true

spring.datasource.hikari.maximum-pool-size=30
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=warn
logging.level.com.example.reserve=warn
